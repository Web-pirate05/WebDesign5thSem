<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All events | Mehhfil</title>
<meta name="description" content="Search and filter every upcoming event on Eventora.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("eventora.theme") || "light";</script>
</head>
<body data-page="events">
<header class="nav" id="site-header"></header>
<main class="wrap page">
  <h1 class="page-title">All events</h1>
  <div class="toolbar">
    <div class="search-box"><input id="q" type="search" placeholder="Search by event, venue or category" aria-label="Search events"></div>
    <label class="sort">Sort by <select id="sort"><option value="date">Date (soonest)</option><option value="price">Price (low to high)</option></select></label>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
  <p class="muted" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="empty" hidden>
    <h2>No events match your search</h2>
    <p class="muted">Try a different keyword or clear the filters.</p>
    <button class="btn" id="reset">Clear filters</button>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
